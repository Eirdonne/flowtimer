name: Build FlowTimer for macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: macOS ZIP and DMG (Intel + Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Intel packages
        run: npx electron-builder --mac --x64 --publish never
      - name: Save Intel packages
        uses: actions/upload-artifact@v4
        with:
          name: FlowTimer-macOS-Intel
          path: |
            dist/*x64*.zip
            dist/*x64*.dmg
          if-no-files-found: error
      - name: Build Apple Silicon packages
        run: npx electron-builder --mac --arm64 --publish never
      - name: Save Apple Silicon packages
        uses: actions/upload-artifact@v4
        with:
          name: FlowTimer-macOS-Apple-Silicon
          path: |
            dist/*arm64*.zip
            dist/*arm64*.dmg
          if-no-files-found: error

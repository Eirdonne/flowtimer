name: Build FlowTimer for macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS packages
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Upload FlowTimer packages
        uses: actions/upload-artifact@v4
        with:
          name: FlowTimer-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

name: Build FlowTimer for macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Universal macOS ZIP and DMG
    # Current supported Intel label for private repositories.
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build universal macOS packages
        run: npx electron-builder --mac --universal --publish never
      - name: Upload universal FlowTimer packages
        uses: actions/upload-artifact@v4
        with:
          name: FlowTimer-macOS-Universal
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

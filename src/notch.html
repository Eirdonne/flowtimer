<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="notch.css"><title>FlowTimer Island</title></head>
<body>
  <section class="island" id="island">
    <div class="grab" title="Drag"></div>
    <button class="mode" id="mode" title="Switch count mode">●</button>
    <button id="timeButton" title="Change countdown duration"><span id="time">05:00</span></button>
    <div class="mini-progress"><i id="fill"></i></div>
    <button id="toggle" class="action" title="Start or pause">▶</button>
    <button id="reset" class="action" title="Reset and repeat">↻</button>
    <button id="stop" class="action muted" title="Stop">■</button>
    <button id="quit" class="close" title="Quit FlowTimer">×</button>
  </section>
  <script src="notch.js"></script>
</body></html>

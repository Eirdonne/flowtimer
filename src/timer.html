<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="timer.css"><title>FlowTimer</title></head>
<body>
  <main class="card" id="card">
    <div class="topline"><span class="eyebrow">FLOWTIMER</span><span class="hint">click start · double-click repeat</span></div>
    <div class="time" id="time">05:00</div>
    <div class="progress"><div id="progressFill"></div></div>
    <div class="controls">
      <button id="modeButton" class="pill">COUNTDOWN</button>
      <select id="durationSelect" aria-label="Duration">
        <option value="60">1 min</option><option value="300" selected>5 min</option><option value="600">10 min</option><option value="900">15 min</option><option value="1500">25 min</option><option value="2700">45 min</option><option value="3600">60 min</option><option value="custom">Custom…</option>
      </select>
      <button id="resetButton" class="icon" title="Reset and repeat">↻</button>
    </div>
    <div class="footer"><span id="status">Ready</span><button id="stopButton" class="stop">Stop</button></div>
  </main>
  <script src="timer.js"></script>
</body>
</html>
